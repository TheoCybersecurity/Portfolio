    <link href="assets/css/style.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container-fluid { font-size: 0.9rem; }
        .table-logs td { vertical-align: middle; }
        .ua-info { font-size: 0.75rem; color: #666; }
        .badge-action { width: 100%; display: block; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 5px; max-height: 300px; overflow-y: auto; font-size: 0.8rem; }
    </style>
</head>
<body>
<script src="assets/js/demo.js"></script>

<div class="container-fluid px-4 mt-4 mb-5">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold text-danger"><i class="fas fa-shield-alt"></i> Logs Techniques</h2>
        <a href="logs.html" class="btn btn-outline-secondary"><i class="fas fa-arrow-left"></i> Retour Logs Métier</a>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body py-2">
            <form class="row g-2 align-items-center" id="audit-filters">
                <div class="col-md-3">
                    <select class="form-select form-select-sm" id="f-admin">
                        <option value="">-- Tous les Admins --</option>
                        <option>Théo MARESCAL</option>
                        <option>Chloé BONNET</option>
                        <option>Maxime AUBERT</option>
                        <option>Inès CHEVALIER</option>
                        <option>Rayan MOREAU</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="form-select form-select-sm" id="f-action">
                        <option value="">-- Toutes les Actions --</option>
                        <option>ORDER_CREATED</option>
                        <option>PAYMENT_VALIDATED</option>
                        <option>PAYMENT_CANCELLED</option>
                        <option>ORDER_UPDATED</option>
                        <option>PREP_CONFIRMED</option>
                        <option>DELIVERY_CONFIRMED</option>
                        <option>RECIPIENT_DELETED</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <input type="text" class="form-control form-control-sm" id="f-search" placeholder="Recherche (IP, Détails, ID...)">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-sm btn-primary w-100">Filtrer</button>
                </div>
                <div class="col-md-1">
                    <a href="#" class="btn btn-sm btn-outline-secondary w-100" id="f-reset">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover table-logs mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th style="width: 140px;">Date</th>
                            <th>Admin / User</th>
                            <th>Action</th>
                            <th>Cible</th>
                            <th>Détails</th>
                            <th>Technique (IP / OS)</th>
                            <th class="text-end">Données</th>
                        </tr>
                    </thead>
                    <tbody id="audit-rows"></tbody>
                </table>
            </div>
            <div class="text-center text-muted py-5 d-none" id="audit-empty">Aucune entrée ne correspond aux filtres.</div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalDiff" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title"><i class="fas fa-exchange-alt"></i> Détails des modifications</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-6 border-end">
                        <h6 class="text-danger border-bottom pb-2">❌ Avant (Old Value)</h6>
                        <pre id="jsonOld"></pre>
                    </div>
                    <div class="col-md-6">
                        <h6 class="text-success border-bottom pb-2">✅ Après (New Value)</h6>
                        <pre id="jsonNew"></pre>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* Code couleur conditionnel selon le type d'action — même règles que le site. */
function badgeClass(action) {
    if (action.indexOf('DELETE') !== -1)    return 'bg-danger';
    if (action.indexOf('UPDATE') !== -1)    return 'bg-warning text-dark';
    if (action.indexOf('VALIDATED') !== -1) return 'bg-success';
    if (action.indexOf('CONFIRMED') !== -1) return 'bg-info text-dark';
    return 'bg-secondary';
}

function uaIcon(ua) {
    if (ua.indexOf('iPhone') !== -1) return '<i class="fab fa-apple"></i>';
    if (ua.indexOf('Android') !== -1) return '<i class="fab fa-android"></i>';
    return '<i class="fab fa-windows"></i>';
}

function renderLogs() {
    var fAdmin = document.getElementById('f-admin').value;
    var fAction = document.getElementById('f-action').value;
    var q = document.getElementById('f-search').value.trim().toLowerCase();

    var rows = LOGS.filter(function (l) {
        if (fAdmin && l.user !== fAdmin) return false;
        if (fAction && l.action !== fAction) return false;
        if (q) {
            var hay = (l.details + ' ' + l.ip + ' ' + l.targetId + ' ' + l.target + ' ' + l.user).toLowerCase();
            if (hay.indexOf(q) === -1) return false;
        }
        return true;
    });

    document.getElementById('audit-empty').classList.toggle('d-none', rows.length > 0);

    document.getElementById('audit-rows').innerHTML = rows.map(function (l, i) {
        var hasDiff = (l.old !== null || l.new !== null);
        return ''
        + '<tr>'
        +   '<td class="small fw-bold">' + esc(l.date) + '</td>'
        +   '<td>' + (l.user
                ? '<i class="fas fa-user-circle text-secondary"></i> ' + esc(l.user)
                : '<span class="text-muted fst-italic">Système / Invité</span>') + '</td>'
        +   '<td><span class="badge ' + badgeClass(l.action) + ' badge-action">' + esc(l.action) + '</span></td>'
        +   '<td class="small"><strong>' + esc(l.target) + '</strong> <span class="text-muted">#' + l.targetId + '</span></td>'
        +   '<td class="small text-truncate" style="max-width: 250px;" title="' + esc(l.details) + '">' + esc(l.details) + '</td>'
        +   '<td class="ua-info">'
        +     '<div><i class="fas fa-network-wired"></i> ' + esc(l.ip) + '</div>'
        +     '<div>' + uaIcon(l.ua) + ' ' + esc(l.ua) + '</div>'
        +   '</td>'
        +   '<td class="text-end">'
        +     (hasDiff
                ? '<button class="btn btn-sm btn-outline-primary btn-view-diff" data-bs-toggle="modal" data-bs-target="#modalDiff" data-idx="' + LOGS.indexOf(l) + '"><i class="fas fa-code-branch"></i> Diff</button>'
                : '<span class="text-muted small">-</span>')
        +   '</td>'
        + '</tr>';
    }).join('');
}

document.addEventListener('DOMContentLoaded', function () {
    renderLogs();

    document.getElementById('audit-filters').addEventListener('submit', function (e) { e.preventDefault(); renderLogs(); });
    document.getElementById('f-admin').addEventListener('change', renderLogs);
    document.getElementById('f-action').addEventListener('change', renderLogs);
    document.getElementById('f-search').addEventListener('input', renderLogs);
    document.getElementById('f-reset').addEventListener('click', function (e) {
        e.preventDefault();
        document.getElementById('f-admin').value = '';
        document.getElementById('f-action').value = '';
        document.getElementById('f-search').value = '';
        renderLogs();
    });

    /* Gestionnaire d'événement pour l'affichage de la modale Diff */
    document.getElementById('modalDiff').addEventListener('show.bs.modal', function (event) {
        var log = LOGS[parseInt(event.relatedTarget.getAttribute('data-idx'), 10)];
        document.getElementById('jsonOld').textContent = log.old ? JSON.stringify(log.old, null, 4) : 'Aucune donnée';
        document.getElementById('jsonNew').textContent = log.new ? JSON.stringify(log.new, null, 4) : 'Aucune donnée';
    });
});
</script>
